/* ============ ID ВЛАДЕЛЬЦА ============ */

var SafeStorage = (function() {
  var available = false;
  try {
    var t = '__test__' + Date.now();
    window.localStorage.setItem(t, 'x');
    window.localStorage.removeItem(t);
    available = true;
  } catch (e) { available = false; }

  return {
    available: available,
    get: function(key, fallback) {
      if (fallback === undefined) fallback = null;
      if (!available) return fallback;
      try {
        var v = window.localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) { return fallback; }
    },
    set: function(key, value) {
      if (!available) return false;
      try { window.localStorage.setItem(key, value); return true; }
      catch (e) { return false; }
    }
  };
})();

function getOwnerId() {

/* ============ ФОН: МОЛЕКУЛЫ ============ */
(function() {
  var canvas = document.getElementById('bgCanvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var particles = [];
  var mouse = { x: -9999, y: -9999 };
  var time = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.min(90, Math.max(35, Math.floor((W * H) / 18000)));
    particles = [];
    for (var i = 0; i < count; i++) particles.push(makeP());
  }

  function makeP() {
    return {
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
      r: Math.random() * 1.8 + 1,
      isBlack: Math.random() < 0.3,
      hue: 110 + Math.random() * 30,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.01 + Math.random() * 0.02
    };
  }

  function drawConn(a, b, dist) {
    var alpha = (1 - dist / 150) * 0.55;
    var hue = 120 + Math.sin(time * 0.5 + a.x * 0.01) * 25;
    var lightness = 55 + Math.sin(time + a.y * 0.02) * 15;
    var g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g.addColorStop(0, 'hsla(' + hue + ',90%,' + lightness + '%,' + alpha + ')');
    g.addColorStop(1, 'hsla(' + (hue + 20) + ',90%,' + lightness + '%,' + (alpha * 0.5) + ')');
    ctx.strokeStyle = g;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function drawP(p) {
    p.pulse += p.pulseSpeed;
    var pulseFactor = 1 + Math.sin(p.pulse) * 0.4;
    var hue = p.hue + Math.sin(time * 0.8 + p.x * 0.01) * 20;
    var lightBase = 60 + Math.sin(p.pulse) * 12;
    var glow = p.r * 8 * pulseFactor;
    var grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glow);
    if (p.isBlack) {
      grd.addColorStop(0, 'rgba(0,0,0,1)');
      grd.addColorStop(0.35, 'rgba(10,20,15,0.85)');
      grd.addColorStop(0.6, 'hsla(' + hue + ',80%,45%,0.5)');
      grd.addColorStop(1, 'hsla(' + hue + ',80%,60%,0)');
    } else {
      grd.addColorStop(0, 'hsla(' + hue + ',95%,' + (lightBase + 25) + '%,1)');
      grd.addColorStop(0.4, 'hsla(' + hue + ',95%,' + lightBase + '%,0.55)');
      grd.addColorStop(1, 'hsla(' + hue + ',95%,' + lightBase + '%,0)');
    }
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(p.x, p.y, glow, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    if (p.isBlack) {
      ctx.fillStyle = '#000';
      ctx.strokeStyle = 'hsla(' + hue + ',90%,65%,0.9)';
      ctx.lineWidth = 1.2;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = 'hsla(' + hue + ',100%,' + (lightBase + 20) + '%,1)';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function animate() {
    time += 0.016;
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, W, H);
    var i, j, p, dx, dy, dSq, d, force;
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      dx = p.x - mouse.x; dy = p.y - mouse.y;
      dSq = dx * dx + dy * dy;
      if (dSq < 32400 && dSq > 0) {
        d = Math.sqrt(dSq);
        force = (1 - d / 180) * 0.6;
        p.x += (dx / d) * force;
        p.y += (dy / d) * force;
      }
      if (p.x < 0) { p.x = 0; p.vx *= -1; }
      if (p.x > W) { p.x = W; p.vx *= -1; }
      if (p.y < 0) { p.y = 0; p.vy *= -1; }
      if (p.y > H) { p.y = H; p.vy *= -1; }
    }
    for (i = 0; i < particles.length; i++) {
      for (j = i + 1; j < particles.length; j++) {
        dx = particles[i].x - particles[j].x;
        dy = particles[i].y - particles[j].y;
        dSq = dx * dx + dy * dy;
        if (dSq < 22500) drawConn(particles[i], particles[j], Math.sqrt(dSq));
      }
    }
    for (i = 0; i < particles.length; i++) drawP(particles[i]);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
  });
  window.addEventListener('mouseleave', function() {
    mouse.x = -9999; mouse.y = -9999;
  });

  resize();
  animate();
})();

/* ============ LOCAL-РЕЖИМ ============ */
function loadCustomCardsLocal() {
  var raw = SafeStorage.get(STORAGE_KEY, null);
  if (!raw) return [];
  try {
    var arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.map(function(p) {
      var copy = {};
      for (var k in p) if (Object.prototype.hasOwnProperty.call(p, k)) copy[k] = p[k];
      copy.custom = true;
      if (!copy.category) copy.category = 'set';
      return copy;
    });
  } catch (e) { return []; }
}

function saveCustomCardsLocal() {
  var customOnly = products.filter(function(p) { return p.custom; });
  try { SafeStorage.set(STORAGE_KEY, JSON.stringify(customOnly)); } catch (e) {}
}

function loadNextIdLocal() {
  var v = Number(SafeStorage.get(STORAGE_ID_KEY, null));
  return v && v >= 100 ? v : 100;
}

function saveNextIdLocal() {
  SafeStorage.set(STORAGE_ID_KEY, String(nextId));
}

function loadActivityLocal() {
  var raw = SafeStorage.get(ACTIVITY_KEY, null);
  if (!raw) return;
  try {
    var obj = JSON.parse(raw);
    if (obj && typeof obj === 'object') {
      activity.viewed = Array.isArray(obj.viewed) ? obj.viewed.slice(-30) : [];
      activity.carted = Array.isArray(obj.carted) ? obj.carted.slice(-30) : [];
    }
  } catch (e) {}
}

function saveActivityLocal() {
  try {
    SafeStorage.set(ACTIVITY_KEY, JSON.stringify({
      viewed: activity.viewed.slice(-30),
      carted: activity.carted.slice(-30)

  } catch (e) {}
}

function loadChatsLocal() {
  var raw = SafeStorage.get(CHATS_KEY, null);
  if (!raw) return;
  try {
    var obj = JSON.parse(raw);
    if (obj && obj.chats && typeof obj.chats === 'object') {
      chatsByProduct = obj.chats;
    }
  } catch (e) {}
}

function saveChatsLocal() {
  try { SafeStorage.set(CHATS_KEY, JSON.stringify({ chats: chatsByProduct })); } catch (e) {}
}

function addMessageLocal(pid, role, text) {
  if (!chatsByProduct[pid]) chatsByProduct[pid] = [];
  chatsByProduct[pid].push({ from: role, text: text, time: Date.now() });
  if (chatsByProduct[pid].length > 200) {
    chatsByProduct[pid].splice(0, chatsByProduct[pid].length - 200);
  }
  saveChatsLocal();
}

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
function detectModeAndInit() {
  var loadingBadge = document.getElementById('loadingBadge');
  if (loadingBadge) loadingBadge.classList.add('visible');

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    if (loadingBadge) loadingBadge.classList.remove('visible');
  }

  var timeout = setTimeout(function() {
    if (done) return;
    finish();
    console.warn('Сервер не ответил за 15 секунд — оффлайн-режим');
    initLocalMode();
  }, 15000);

  fetch('/api/products')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (done) return;
      clearTimeout(timeout);
      finish();
      MODE = 'server';
      console.log('✅ Режим: сервер. Загружено товаров:', data.length);
      initServerMode(data);
    })
    .catch(function(err) {
      if (done) return;
      clearTimeout(timeout);
      finish();
      console.warn('⚠️ Сервер недоступен:', err.message);
      initLocalMode();
    });
}

function initLocalMode() {
  MODE = 'local';
  document.getElementById('offlineBadge').classList.add('visible');

  products = BASE_PRODUCTS.concat(loadCustomCardsLocal());
  loadActivityLocal();

}

function initServerMode(serverProducts) {

  renderCart();

}

/* Приводим ответ сервера к единому виду: id — всегда число */
function normalizeServerProducts(list) {
  if (!Array.isArray(list)) return [];
  return list.filter(function(p) {
    return p && p.id !== null && p.id !== undefined && !isNaN(Number(p.id));
  }).map(function(p) {
    p.id = Number(p.id);
    if (typeof p.rating !== 'number') p.rating = Number(p.rating) || 5;
    return p;
  });
}

/* ============ WEBSOCKET ============ */
function initSocket() {
  socket = createSimpleSocket();

  socket.on('connect', function() {
    console.log('🔌 WebSocket подключён');
  });

  socket.on('message', function(msg) {
    if (currentChatProductId === msg.productId) {
      appendMessageToUI(msg);
    }
    if (chatsModal.classList.contains('open')) renderChatsList();
  });

  socket.on('chat_cleared', function(data) {
    if (currentChatProductId === data.productId) {
      chatBody.innerHTML = emptyChatHtml();
    }
    if (chatsModal.classList.contains('open')) renderChatsList();
  });

  socket.on('chats_updated', function() {
    if (chatsModal.classList.contains('open')) renderChatsList();
  });

  socket.on('products_updated', function() {
    loadProductsFromServer();
  });
}

function createSimpleSocket() {
  var proto = (location.protocol === 'https:') ? 'wss://' : 'ws://';
  var ws = new WebSocket(proto + location.host + '/ws/chat');
  var handlers = {};

  ws.onopen = function() { if (handlers.connect) handlers.connect(); };
  ws.onclose = function() {};
  ws.onerror = function(err) { console.error('WebSocket error:', err); };

  ws.onmessage = function(e) {
    try {
      var data = JSON.parse(e.data);
      var t = data.type;
      if (t === 'message' && handlers.message) handlers.message(data);
      else if (t === 'chat_cleared' && handlers.chat_cleared) handlers.chat_cleared(data);
      else if (t === 'chats_updated' && handlers.chats_updated) handlers.chats_updated();
      else if (t === 'products_updated' && handlers.products_updated) handlers.products_updated();
    } catch (err) {
      console.error('WS parse error:', err);
    }
  };

  return {
    on: function(event, handler) { handlers[event] = handler; },
    emit: function(event, data) {
      if (ws.readyState !== 1) return;
      if (event === 'join') {
        ws.send(JSON.stringify({ type: 'join', productId: data }));
      } else if (event === 'leave') {
        ws.send(JSON.stringify({ type: 'leave', productId: data }));
      } else if (event === 'message') {
        ws.send(JSON.stringify({
          type: 'message',
          productId: data.productId,
          role: data.role,
          text: data.text
        }));
      }
    }
  };
}

function loadProductsFromServer() {
  fetch('/api/products')
    .then(function(res) { return res.json(); })
    .then(function(fromServer) {
      products = normalizeServerProducts(fromServer);
      renderProducts();
      renderNetworkStats();
      updateCategoryDatalist();
      renderRecommendations();
    })
    .catch(function(err) { console.error('Ошибка загрузки товаров:', err); });
}

/* ============ КАТЕГОРИИ ============ */
function categoryLabel(p) {
  if (p.categoryName) return p.categoryName;
  for (var i = 0; i < STANDARD_CATEGORIES.length; i++) {
    if (STANDARD_CATEGORIES[i].key === p.category) return STANDARD_CATEGORIES[i].name;
  }
  return p.category || 'Разное';
}

function resolveCategory(inputText) {
  var text = String(inputText || '').trim();
  if (!text) return null;
  var lower = text.toLowerCase();
  if (CATEGORY_SYNONYMS.hasOwnProperty(lower)) {
    var stdKey = CATEGORY_SYNONYMS[lower];
    for (var i = 0; i < STANDARD_CATEGORIES.length; i++) {
      if (STANDARD_CATEGORIES[i].key === stdKey) {
        return { key: stdKey, name: STANDARD_CATEGORIES[i].name };
      }
    }
  }
  var slug = text.toLowerCase().replace(/\s+/g, '_').replace(/[^a-zа-яё0-9_]/gi, '');
  if (!slug) slug = 'cat_' + Date.now();
  return { key: 'custom_' + slug, name: text };
}

function collectUsedCategories() {
  var seen = {};
  var list = [];
  for (var i = 0; i < products.length; i++) {
    var p = products[i];
    if (!seen[p.category]) {
      seen[p.category] = true;
      list.push({ key: p.category, name: categoryLabel(p) });
    }
  }
  return list;
}

  if (activity.viewed.length > 30) activity.viewed = activity.viewed.slice(-30);
  if (MODE === 'local') saveActivityLocal();
  scheduleRecommendations();
}

function trackCart(id) {
  if (!id) return;

  activity.carted.push(id);
  if (activity.carted.length > 30) activity.carted = activity.carted.slice(-30);
  if (MODE === 'local') saveActivityLocal();
  scheduleRecommendations();
}

function updateCategoryDatalist() {
  var names = {};
  for (var i = 0; i < STANDARD_CATEGORIES.length; i++) {
    names[STANDARD_CATEGORIES[i].name] = true;
  }
  for (var j = 0; j < products.length; j++) {
    var label = categoryLabel(products[j]);
    if (label) names[label] = true;
  }
  var html = '';
  for (var n in names) {
    if (Object.prototype.hasOwnProperty.call(names, n)) {
      html += '<option value="' + escapeHtml(n) + '">';
    }
  }
  categoryList.innerHTML = html;
}

  photoPreview.classList.add('visible');
  photoUpload.classList.add('has-image');

  errorPhoto.classList.remove('show');

  photoInput.value = '';
  photoPreview.src = '';
  photoPreview.classList.remove('visible');
  photoUpload.classList.remove('has-image');

photoInput.addEventListener('change', function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type || file.type.indexOf('image/') !== 0) {
    showToast('❌ Можно загрузить только изображение', true);
    photoInput.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('❌ Файл слишком большой (макс. 5 МБ)', true);
    photoInput.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) { setPhoto(ev.target.result); };
  reader.readAsDataURL(file);
});

  e.stopPropagation();
  clearPhoto();
});

function validateField(input, errorEl, isInvalid) {
  if (isInvalid) {
    if (input) input.classList.add('invalid');
    if (errorEl) errorEl.classList.add('show');
    return false;
  }
  if (input) input.classList.remove('invalid');
  if (errorEl) errorEl.classList.remove('show');
  return true;
}

async function handlePublish(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (publishing) return;
  publishing = true;

  var btn = $('publishBtn');
  btn.disabled = true;

  try {
    var photoOk = true;
    if (!uploadedImage) {
      photoUpload.classList.add('invalid');
      errorPhoto.classList.add('show');
      photoOk = false;
    }
    var titleOk = validateField(fieldTitle, errorTitle, !fieldTitle.value.trim());
    var descOk = validateField(fieldDesc, errorDesc, !fieldDesc.value.trim());
    var resolvedCat = resolveCategory(fieldCategory.value);
    var catOk = validateField(fieldCategory, errorCategory, !resolvedCat);

    if (!photoOk || !titleOk || !descOk || !catOk) {
      var missing = [];
      if (!photoOk) missing.push('фото');
      if (!titleOk) missing.push('название');
      if (!descOk) missing.push('описание');
      if (!catOk) missing.push('категория');
      showToast('⚠️ Заполните: ' + missing.join(', '), true);
      return;
    }

    var newProduct = {
      id: null,
      title: fieldTitle.value.trim(),
      desc: fieldDesc.value.trim(),
      category: resolvedCat.key,
      categoryName: resolvedCat.name,
      rating: 5.0,
      badge: 'ВАШ ТОВАР',
      custom: true,
      image: uploadedImage,
      icon: null,
      ownerId: MY_OWNER_ID
    };

    var justAddedId = null;

    if (MODE === 'server') {
      // --- Публикуем на сервер ---
      var res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newProduct)
      });

      if (!res.ok) {
        var errText = '';
        try { errText = (await res.json()).error || ''; } catch (e2) {}
        throw new Error('Сервер вернул ' + res.status + (errText ? ': ' + errText : ''));
      }

      var saved = await res.json();

      // Жёсткая проверка: сервер обязан вернуть валидный id
      if (!saved || saved.id === null || saved.id === undefined || isNaN(Number(saved.id))) {
        throw new Error('Сервер не вернул id нового товара');
      }

      newProduct.id = Number(saved.id);
      justAddedId = newProduct.id;

      // Перечитываем актуальный список с сервера — гарантия консистентности
      try {
        var syncRes = await fetch('/api/products');
        if (syncRes.ok) {
          products = normalizeServerProducts(await syncRes.json());
        } else {
          products.unshift(newProduct);
        }
      } catch (syncErr) {
        console.warn('Не удалось перечитать товары, использую локальную копию:', syncErr);
        products.unshift(newProduct);
      }

    } else {
      // --- Локальный режим ---
      newProduct.id = nextId++;
      saveNextIdLocal();
      justAddedId = newProduct.id;
      products.unshift(newProduct);
      saveCustomCardsLocal();
    }

    // Сбрасываем форму
    builderForm.reset();
    clearPhoto();
    [fieldTitle, fieldDesc, fieldCategory].forEach(function(el) {
      el.classList.remove('invalid');
    });
    [errorTitle, errorDesc, errorCategory].forEach(function(el) {
      el.classList.remove('show');
    });

    builderFormWrap.classList.remove('open');
    builderToggle.classList.remove('open');
    builderToggle.textContent = '➕ Открыть конструктор';

    state.category = 'all';
    state.search = '';
    state.sort = 'default';
    searchInput.value = '';
    sortSelect.value = 'default';
    clearSearch.classList.remove('visible');

    renderCategoryFilters();
    renderProducts();
    renderNetworkStats();
    updateCategoryDatalist();

    setTimeout(function() {
      var cardEl = productsEl.querySelector('.card[data-id="' + justAddedId + '"]');
      if (cardEl) {
        cardEl.classList.add('just-added');
        try { cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        catch (err) { cardEl.scrollIntoView(); }
        setTimeout(function() { cardEl.classList.remove('just-added'); }, 1600);
      }
    }, 60);

    showToast('📡 «' + newProduct.title + '» опубликован в сети');

  } catch (err) {
    console.error('Publish error:', err);
    showToast('❌ Ошибка: ' + (err.message || 'что-то пошло не так'), true);
  } finally {
    publishing = false;
    btn.disabled = false;
  }
}

$('publishBtn').addEventListener('click', handlePublish);
builderForm.addEventListener('submit', handlePublish);

$('builderReset').addEventListener('click', function() {
  builderForm.reset();
  clearPhoto();
  [fieldTitle, fieldDesc, fieldCategory].forEach(function(el) {
    el.classList.remove('invalid');
  });
  [errorTitle, errorDesc, errorCategory].forEach(function(el) {

/* ============ ФИЛЬТРЫ КАТЕГОРИЙ ============ */
function renderCategoryFilters() {
  var items = [{ key: 'all', name: 'Все' }];

  for (var i = 0; i < STANDARD_CATEGORIES.length; i++) {
    items.push({
      key: STANDARD_CATEGORIES[i].key,
      name: STANDARD_CATEGORIES[i].emoji + ' ' + STANDARD_CATEGORIES[i].name
    });
  }

  var used = collectUsedCategories();
  for (var j = 0; j < used.length; j++) {
    var u = used[j];
    var isStandard = false;
    for (var k = 0; k < STANDARD_CATEGORIES.length; k++) {
      if (STANDARD_CATEGORIES[k].key === u.key) { isStandard = true; break; }
    }
    if (!isStandard) items.push({ key: u.key, name: '🏷️ ' + u.name });
  }

  var exists = false;
  for (var m = 0; m < items.length; m++) {
    if (items[m].key === state.category) { exists = true; break; }
  }
  if (!exists) state.category = 'all';

  var html = '';
  for (var n = 0; n < items.length; n++) {
    var active = items[n].key === state.category ? ' active' : '';
    html += '<div class="category' + active + '" data-category="' +
            escapeHtml(items[n].key) + '">' + escapeHtml(items[n].name) + '</div>';
  }
  categoriesEl.innerHTML = html;
}

/* ============ СТАТИСТИКА ============ */
function renderNetworkStats() {
  var counts = {};
  var custom = 0;

  for (var i = 0; i < products.length; i++) {
    var p = products[i];
    if (p.custom) custom++;
    if (!counts[p.category]) counts[p.category] = { name: categoryLabel(p), count: 0 };
    counts[p.category].count++;
  }

  var html = '';
  html += '<div class="stat-chip">📦 Всего в сети: <strong>' + products.length + '</strong></div>';
  html += '<div class="stat-chip">✨ Ваших: <strong>' + custom + '</strong></div>';

  for (var j = 0; j < STANDARD_CATEGORIES.length; j++) {
    var s = STANDARD_CATEGORIES[j];
    var c = counts[s.key] ? counts[s.key].count : 0;
    html += '<div class="stat-chip">' + s.emoji + ' ' + s.name + ': <strong>' + c + '</strong></div>';
    if (counts[s.key]) delete counts[s.key];
  }

  for (var k in counts) {
    if (Object.prototype.hasOwnProperty.call(counts, k)) {
      html += '<div class="stat-chip">🏷️ ' + escapeHtml(counts[k].name) +
              ': <strong>' + counts[k].count + '</strong></div>';
    }
  }

  networkStatsEl.innerHTML = html;
}

/* ============ ФИЛЬТРАЦИЯ ============ */
function getFiltered() {
  var list = products.slice();

  if (state.category !== 'all') {
    list = list.filter(function(p) { return p.category === state.category; });
  }

  if (state.search.trim()) {
    var q = state.search.trim().toLowerCase();
    list = list.filter(function(p) {
      return p.title.toLowerCase().indexOf(q) !== -1 ||
             p.desc.toLowerCase().indexOf(q) !== -1 ||
             categoryLabel(p).toLowerCase().indexOf(q) !== -1;
    });
  }

  switch (state.sort) {
    case 'rating': list.sort(function(a, b) { return b.rating - a.rating; }); break;
    case 'name': list.sort(function(a, b) { return a.title.localeCompare(b.title, 'ru'); }); break;
  }

  return list;
}

/* ============ ОТРИСОВКА ============ */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function isMyCard(p) {
  return p.custom && p.ownerId && p.ownerId === MY_OWNER_ID;
}

function hasValidServerId(p) {
  return p && p.id !== null && p.id !== undefined && !isNaN(Number(p.id));
}

function buildCardHtml(p, opts) {
  opts = opts || {};
  var imgContent = p.image
    ? '<img src="' + p.image + '" alt="' + escapeHtml(p.title) + '">'
    : (p.icon || '🆕');

  var badgeHtml = '';
  if (opts.rec && opts.recText) {
    badgeHtml = '<div class="rec-label">✨ ' + escapeHtml(opts.recText) + '</div>';
  } else if (p.badge) {
    badgeHtml = '<div class="badge' + (p.custom ? ' custom' : '') + '">' + escapeHtml(p.badge) + '</div>';
  }

  var deleteBtn = (isMyCard(p) && !opts.rec)
    ? '<button class="delete-card-btn" data-delete="' + p.id + '" title="Удалить" type="button">🗑️</button>'
    : '';

  // Кнопка чата — только если у товара валидный id
  var chatBtn = hasValidServerId(p)
    ? '<button class="chat-btn" data-action="chat" data-id="' + p.id + '" title="Написать продавцу" type="button">💬</button>'
    : '';

  return (
    '<article class="card" data-id="' + p.id + '">' +
      badgeHtml + deleteBtn +
      '<div class="card-image" data-action="open">' + imgContent + '</div>' +
      '<div class="card-body">' +
        '<div class="card-category">' + escapeHtml(categoryLabel(p)) + '</div>' +
        '<h3 class="card-title" data-action="open">' + escapeHtml(p.title) + '</h3>' +
        '<p class="card-desc">' + escapeHtml(p.desc) + '</p>' +
        '<div class="rating">★★★★★ <span>' + p.rating.toFixed(1) + '</span></div>' +
        '<div class="card-footer">' +
          '<div class="card-actions">' +
            chatBtn +
            '<button class="buy-btn" data-action="add" data-id="' + p.id + '" type="button">❤️ Нравится</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</article>'
  );
}

function renderProducts() {
  var list = getFiltered();

  resultsInfo.textContent = list.length
    ? 'Показано в сети: ' + list.length + ' из ' + products.length
    : '';

  if (!list.length) {
    var isEmptyNetwork = products.length === 0;
    productsEl.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">' + (isEmptyNetwork ? '✨' : '🔍') + '</div>' +
        '<h3>' + (isEmptyNetwork ? 'В сети пока нет карточек' : 'Ничего не найдено') + '</h3>' +
        '<p>' + (isEmptyNetwork
          ? 'Создайте первую карточку через конструктор выше 👆'
          : 'Попробуйте изменить запрос или выбрать другую категорию.') + '</p>' +
      '</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < list.length; i++) html += buildCardHtml(list[i]);
  productsEl.innerHTML = html;
}

/* ============ РЕКОМЕНДАЦИИ ============ */
function getRecommendations(limit) {
  if (limit === undefined) limit = 4;
  if (!products.length) return [];

  var weights = {};
  var hasActivity = false;

  function bump(catKey, amount) {
    if (!catKey) return;
    if (!weights[catKey]) weights[catKey] = 0;
    weights[catKey] += amount;
  }

  for (var i = 0; i < activity.carted.length; i++) {
    var cp = findProduct(activity.carted[i]);
    if (cp) { bump(cp.category, 2); hasActivity = true; }
  }
  for (var j = 0; j < activity.viewed.length; j++) {
    var vp = findProduct(activity.viewed[j]);
    if (vp) { bump(vp.category, 1); hasActivity = true; }
  }

  var excluded = {};
  for (var m = 0; m < activity.viewed.length; m++) excluded[activity.viewed[m]] = true;
  for (var n = 0; n < activity.carted.length; n++) excluded[activity.carted[n]] = true;

  var candidates = products.filter(function(p) { return !excluded[p.id]; });
  if (!hasActivity) return [];

  var scored = candidates.map(function(p) {
    var w = weights[p.category] || 0;
    return { p: p, score: w * 10 + (p.rating || 0) * 0.3 + (p.custom ? 0.5 : 0) };
  });

  scored.sort(function(a, b) { return b.score - a.score; });

  var result = [];
  for (var k = 0; k < scored.length && result.length < limit; k++) {
    if (scored[k].score >= 10) result.push(scored[k].p);
  }
  return result;
}

function findProduct(id) {
  if (id === null || id === undefined) return null;
  var numId = Number(id);
  if (isNaN(numId)) return null;
  for (var i = 0; i < products.length; i++) {
    if (Number(products[i].id) === numId) return products[i];
  }
  return null;
}

function getRecommendationReason() {
  var cartedCats = {};
  var viewedCats = {};

  for (var i = 0; i < activity.carted.length; i++) {
    var cp = findProduct(activity.carted[i]);
    if (cp) cartedCats[cp.category] = categoryLabel(cp);
  }
  for (var j = 0; j < activity.viewed.length; j++) {
    var vp = findProduct(activity.viewed[j]);
    if (vp) viewedCats[vp.category] = categoryLabel(vp);
  }

  var cartedList = Object.keys(cartedCats).map(function(k) { return cartedCats[k]; });
  var viewedList = Object.keys(viewedCats).map(function(k) { return viewedCats[k]; });

  if (cartedList.length) return '❤️ По вашим понравившимся: ' + cartedList.slice(0, 2).join(', ');
  if (viewedList.length) return '👁️ На основе просмотров: ' + viewedList.slice(0, 2).join(', ');
  return '✨ На основе ваших интересов';
}

var recTimeout = null;
function scheduleRecommendations() {
  if (recTimeout) clearTimeout(recTimeout);
  recTimeout = setTimeout(renderRecommendations, 250);
}

function renderRecommendations() {
  var recs = getRecommendations(4);
  if (!recs.length) {
    recommendationsEl.classList.remove('visible');
    recommendationsGrid.innerHTML = '';
    return;
  }

  recReason.textContent = getRecommendationReason();

  var html = '';
  for (var i = 0; i < recs.length; i++) {
    var reason = 'Похожее';
    for (var j = 0; j < activity.carted.length; j++) {
      var cp = findProduct(activity.carted[j]);
      if (cp && cp.category === recs[i].category) { reason = 'Вам нравится'; break; }
    }
    if (reason === 'Похожее') {
      for (var k = 0; k < activity.viewed.length; k++) {
        var vp = findProduct(activity.viewed[k]);
        if (vp && vp.category === recs[i].category) { reason = 'Вы смотрели'; break; }
      }
    }
    html += buildCardHtml(recs[i], { rec: true, recText: reason });
  }
  recommendationsGrid.innerHTML = html;
  recommendationsEl.classList.add('visible');
}

/* ============ СОБЫТИЯ КАРТОЧЕК ============ */
async function handleProductClick(e) {
  var delBtn = e.target.closest('[data-delete]');
  if (delBtn) {
    var id = Number(delBtn.getAttribute('data-delete'));
    var idx = -1;
    for (var i = 0; i < products.length; i++) {
      if (Number(products[i].id) === id) { idx = i; break; }
    }
    if (idx !== -1) {
      var target = products[idx];

      if (!isMyCard(target)) {
        showToast('🚫 Это не ваша карточка', true);
        return;
      }

      var name = target.title;
      products.splice(idx, 1);

      if (MODE === 'server') {
        try {
          var res = await fetch('/api/products/' + id, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ownerId: MY_OWNER_ID })
          });
          if (!res.ok && res.status !== 404) {
            console.warn('Ошибка удаления на сервере:', res.status);
          }
        } catch (err) {
          console.error('Ошибка удаления:', err);
        }
      } else {
        delete chatsByProduct[id];
        saveChatsLocal();
        saveCustomCardsLocal();
      }

      state.cart = state.cart.filter(function(x) { return x.id !== id; });
      renderCategoryFilters();
      renderCart();
      updateCartCount();
      renderProducts();
      renderNetworkStats();
      updateCategoryDatalist();
      scheduleRecommendations();
      showToast('🗑️ «' + name + '» удалён из сети');
    }
    return;
  }

  var actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;

  var action = actionEl.getAttribute('data-action');
  var card = e.target.closest('.card');
  if (!card) return;
  var pid = Number(card.getAttribute('data-id'));

  if (isNaN(pid)) {
    showToast('❌ Некорректный id товара', true);
    return;
  }

  if (action === 'add') addToCart(pid);
  else if (action === 'open') openModal(pid);
  else if (action === 'chat') {
    // В серверном режиме не даём открыть чат для товара, которого нет на сервере
    if (MODE === 'server') {
      var prod = findProduct(pid);
      if (!prod || !hasValidServerId(prod)) {
        showToast('❌ Этот товар ещё не синхронизирован с сервером', true);
        return;
      }
    }
    openChat(pid);
  }
}

productsEl.addEventListener('click', handleProductClick);
recommendationsGrid.addEventListener('click', handleProductClick);

/* ============ ПОНРАВИВШИЕСЯ ============ */
function addToCart(id) {
  var item = state.cart.find(function(i) { return i.id === id; });
  if (item) item.qty++;
  else state.cart.push({ id: id, qty: 1 });

  renderCart();
  updateCartCount();
  trackCart(id);

  var product = products.find(function(p) { return Number(p.id) === Number(id); });
  if (product) showToast('❤️ «' + product.title + '» добавлено в понравившиеся');
}

function changeQty(id, delta) {
  var item = state.cart.find(function(i) { return i.id === id; });
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) state.cart = state.cart.filter(function(i) { return i.id !== id; });
  renderCart();
  updateCartCount();
}

function removeFromCart(id) {
  state.cart = state.cart.filter(function(i) { return i.id !== id; });
  renderCart();
  updateCartCount();
}

function updateCartCount() {
  var total = 0;
  for (var i = 0; i < state.cart.length; i++) total += state.cart[i].qty;
  cartCountEl.textContent = total;
  cartCountEl.style.display = total > 0 ? 'flex' : 'none';
}

function renderCart() {
  if (!state.cart.length) {
    cartItemsEl.innerHTML =
      '<div class="cart-empty">' +
        '<div class="cart-empty-icon">🤍</div>' +
        '<p>Пока ничего не понравилось</p>' +
      '</div>';
    cartTotalEl.textContent = '0';
    return;
  }

  var totalItems = 0;
  var html = '';
  for (var i = 0; i < state.cart.length; i++) {
    var item = state.cart[i];
    var p = products.find(function(x) { return Number(x.id) === Number(item.id); });
    if (!p) continue;
    totalItems += item.qty;
    var img = p.image
      ? '<img src="' + p.image + '" alt="' + escapeHtml(p.title) + '">'
      : (p.icon || '🆕');
    html +=
      '<div class="cart-item">' +
        '<div class="cart-item-img">' + img + '</div>' +
        '<div class="cart-item-info">' +
          '<div class="cart-item-title">' + escapeHtml(p.title) + '</div>' +
          '<div class="qty">' +
            '<button data-qty="-1" data-id="' + p.id + '" type="button">−</button>' +
            '<span>' + item.qty + '</span>' +
            '<button data-qty="1" data-id="' + p.id + '" type="button">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="cart-item-actions">' +
          '<button class="cart-item-chat-btn" data-chat-id="' + p.id + '" title="Открыть чат с продавцом" type="button">💬</button>' +
          '<button class="remove-btn" data-remove="' + p.id + '" title="Удалить" type="button">🗑️</button>' +
        '</div>' +
      '</div>';
  }
  cartItemsEl.innerHTML = html;
  cartTotalEl.textContent = totalItems;
}

cartItemsEl.addEventListener('click', function(e) {
  var qtyBtn = e.target.closest('[data-qty]');
  if (qtyBtn) {
    changeQty(Number(qtyBtn.getAttribute('data-id')), Number(qtyBtn.getAttribute('data-qty')));
    return;
  }

  var chatBtn = e.target.closest('[data-chat-id]');
  if (chatBtn) {
    var chatPid = Number(chatBtn.getAttribute('data-chat-id'));
    closeCart();
    setTimeout(function() { openChat(chatPid); }, 300);
    return;
  }

  var removeBtn = e.target.closest('[data-remove]');
  if (removeBtn) removeFromCart(Number(removeBtn.getAttribute('data-remove')));
});

/* ============ ПАНЕЛЬ ПОНРАВИВШИХСЯ ============ */
function openCart() {
  cartPanel.classList.add('open');
  overlay.classList.add('open');
}
function closeCart() {
  cartPanel.classList.remove('open');
  overlay.classList.remove('open');
}

$('cartBtn').addEventListener('click', openCart);
$('closeCart').addEventListener('click', closeCart);
overlay.addEventListener('click', closeCart);

/* ============ МОДАЛЬНОЕ ОКНО ТОВАРА ============ */
function openModal(id) {
  var p = findProduct(id);
  if (!p) { showToast('❌ Товар не найден', true); return; }

  trackView(id);

  var imgContent = p.image
    ? '<img src="' + p.image + '" alt="' + escapeHtml(p.title) + '">'
    : (p.icon || '🆕');

  var chatButton = hasValidServerId(p)
    ? '<button class="modal-chat-btn" data-action="chat" data-id="' + p.id + '" type="button">💬 Чат с продавцом</button>'
    : '';

  modalContent.innerHTML =
    '<div class="modal-img">' + imgContent + '</div>' +
    '<div class="modal-body">' +
      '<div class="card-category">' + escapeHtml(categoryLabel(p)) + '</div>' +
      '<h2>' + escapeHtml(p.title) + '</h2>' +
      '<div class="rating">★★★★★ <span>' + p.rating.toFixed(1) + '</span></div>' +
      '<p>' + escapeHtml(p.desc) + '</p>' +
      '<div class="modal-actions">' +
        '<button class="buy-btn" data-action="add" data-id="' + p.id + '" type="button">❤️ В понравившиеся</button>' +
        chatButton +
      '</div>' +
    '</div>';

  modal.classList.add('open');
}

modal.addEventListener('click', function(e) {
  if (e.target === modal) modal.classList.remove('open');

  var addEl = e.target.closest('[data-action="add"]');
  if (addEl) {
    addToCart(Number(addEl.getAttribute('data-id')));
    modal.classList.remove('open');
    openCart();
    return;
  }

  var chatEl = e.target.closest('[data-action="chat"]');
  if (chatEl) {
    var pid = Number(chatEl.getAttribute('data-id'));
    modal.classList.remove('open');
    openChat(pid);
  }
});

/* ============ ЧАТЫ ============ */
function emptyChatHtml() {
  return '<div class="chat-placeholder">' +
    '<div class="chat-placeholder-icon">💬</div>' +
    '<p>Здесь пока пусто</p>' +
    '<p class="hint">Напишите первое сообщение — оно появится здесь и сохранится</p>' +
    '</div>';
}

function updateChatRoleBadge() {
  if (!chatRoleBadge) return;
  if (currentChatRole === 'seller') {
    chatRoleBadge.textContent = '🏪 Вы — Продавец';
    chatRoleBadge.className = 'chat-role-badge seller';
  } else if (currentChatRole === 'buyer') {
    chatRoleBadge.textContent = '👤 Вы — Покупатель';
    chatRoleBadge.className = 'chat-role-badge buyer';
  } else {
    chatRoleBadge.textContent = '';
    chatRoleBadge.className = 'chat-role-badge';
  }
}

async function openChat(productId) {
  if (productId === null || productId === undefined || isNaN(Number(productId))) {
    showToast('❌ Некорректный id товара', true);
    return;
  }
  productId = Number(productId);

  var p = findProduct(productId);
  if (!p) {
    showToast('❌ Товар не найден в текущем списке', true);
    return;
  }

  if (MODE === 'server') {
    try {
      var joinRes = await fetch('/api/chats/' + productId + '/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ownerId: MY_OWNER_ID })
      });

      if (!joinRes.ok) {
        // 404 / 422 / 500 — читаем ответ как можем
        var errBody = '';
        try { errBody = JSON.stringify(await joinRes.json()); } catch (e) {}
        console.error('join ответил', joinRes.status, errBody);
        showToast('❌ Сервер отклонил запрос (' + joinRes.status + ')', true);
        return;
      }

      var joinData = await joinRes.json();

      if (!joinData || !joinData.allowed) {
        var reason = (joinData && joinData.reason) || 'Доступ запрещён';
        showToast('🚫 ' + reason, true);

        // Если сервер сказал «не найден» — перечитаем список товаров
        if (reason.indexOf('не найден') !== -1) {
          loadProductsFromServer();
        }
        return;
      }

      currentChatRole = joinData.role;
    } catch (err) {
      console.error('Ошибка проверки доступа:', err);
      showToast('❌ Не удалось проверить доступ', true);
      return;
    }
  } else {
    currentChatRole = isMyCard(p) ? 'seller' : 'buyer';
  }

  currentChatProductId = productId;

  chatProductImg.innerHTML = p.image
    ? '<img src="' + p.image + '" alt="' + escapeHtml(p.title) + '">'
    : (p.icon || '🆕');
  chatProductTitle.textContent = p.title;

  updateChatRoleBadge();

  chatModal.classList.add('open');
  chatBody.innerHTML = '<div class="chat-placeholder"><p>Загрузка...</p></div>';

  if (MODE === 'server') {
    if (socket) socket.emit('join', productId);
    try {
      var res = await fetch('/api/chats/' + productId);
      var messages = await res.json();
      renderMessagesFromArray(messages);
    } catch (err) {
      console.error('Ошибка загрузки чата:', err);
      renderMessagesFromArray([]);
    }
  } else {
    renderMessagesFromArray(chatsByProduct[productId] || []);
  }

  setTimeout(function() {
    chatInput.focus();
    scrollChatToBottom();
  }, 150);
}

function renderMessagesFromArray(messages) {
  if (!messages || !messages.length) {
    chatBody.innerHTML = emptyChatHtml();
    return;
  }

  var html = '';
  for (var i = 0; i < messages.length; i++) {
    var m = messages[i];
    if (!m || !m.text) continue;

    var isMine = (m.from === currentChatRole);
    var cls = isMine ? 'me' : 'unit';

    var extraCls = '';
    if (!isMine) {
      extraCls = (m.from === 'seller') ? ' from-seller' : ' from-buyer';
    }

    html +=
      '<div class="msg ' + cls + extraCls + '">' +
        '<span class="msg-text">' + escapeHtml(m.text).replace(/\n/g, '<br>') + '</span>' +
        '<span class="msg-time">' + formatChatTime(m.time) + '</span>' +
      '</div>';
  }
  chatBody.innerHTML = html;
  scrollChatToBottom();
}

function appendMessageToUI(m) {
  var placeholder = chatBody.querySelector('.chat-placeholder');
  if (placeholder) placeholder.remove();

  var isMine = (m.from === currentChatRole);
  var cls = isMine ? 'me' : 'unit';
  var extraCls = '';
  if (!isMine) {
    extraCls = (m.from === 'seller') ? ' from-seller' : ' from-buyer';
  }

  var el = document.createElement('div');
  el.className = 'msg ' + cls + extraCls;
  el.innerHTML =
    '<span class="msg-text">' + escapeHtml(m.text).replace(/\n/g, '<br>') + '</span>' +
    '<span class="msg-time">' + formatChatTime(m.time) + '</span>';
  chatBody.appendChild(el);
  scrollChatToBottom();
}

function scrollChatToBottom() {
  chatBody.scrollTop = chatBody.scrollHeight;
}

chatForm.addEventListener('submit', function(e) {
  e.preventDefault();
  if (currentChatProductId === null) return;
  if (!currentChatRole) return;

  var text = chatInput.value.trim();
  if (!text) return;

  if (MODE === 'server') {
    if (socket) {
      socket.emit('message', {
        productId: currentChatProductId,
        role: currentChatRole,
        text: text
      });
    }
  } else {
    addMessageLocal(currentChatProductId, currentChatRole, text);
    renderMessagesFromArray(chatsByProduct[currentChatProductId]);
  }

  chatInput.value = '';
});

chatClearBtn.addEventListener('click', async function() {
  if (currentChatProductId === null) return;
  if (!window.confirm('Очистить всю историю этого чата?')) return;

  if (MODE === 'server') {
    try {
      await fetch('/api/chats/' + currentChatProductId, { method: 'DELETE' });
    } catch (err) {
      showToast('❌ Не удалось очистить', true);
    }
  } else {
    chatsByProduct[currentChatProductId] = [];
    saveChatsLocal();
    renderMessagesFromArray([]);
  }

  showToast('🗑️ История чата очищена');
});

$('closeChat').addEventListener('click', function() {
  if (MODE === 'server' && socket && currentChatProductId !== null) {
    socket.emit('leave', currentChatProductId);
  }
  chatModal.classList.remove('open');
  currentChatProductId = null;
  currentChatRole = null;
});

chatModal.addEventListener('click', function(e) {
  if (e.target === chatModal) {
    if (MODE === 'server' && socket && currentChatProductId !== null) {
      socket.emit('leave', currentChatProductId);
    }
    chatModal.classList.remove('open');
    currentChatProductId = null;
    currentChatRole = null;
  }
});

chatBack.addEventListener('click', function() {
  if (MODE === 'server' && socket && currentChatProductId !== null) {
    socket.emit('leave', currentChatProductId);
  }
  chatModal.classList.remove('open');
  currentChatProductId = null;
  currentChatRole = null;
  setTimeout(openChatsList, 200);
});

/* ============ СПИСОК ВСЕХ ЧАТОВ ============ */
function openChatsList() {
  renderChatsList();
  chatsModal.classList.add('open');
}

function closeChatsList() {
  chatsModal.classList.remove('open');
}

chatsBtn.addEventListener('click', openChatsList);
closeChats.addEventListener('click', closeChatsList);

chatsModal.addEventListener('click', function(e) {
  if (e.target === chatsModal) closeChatsList();
});

async function renderChatsList() {
  var rows = [];

  if (MODE === 'server') {
    try {
      var res = await fetch('/api/chats');
      rows = await res.json();
    } catch (err) {
      console.error('Ошибка загрузки чатов:', err);
      rows = [];
    }
  } else {
    for (var pid in chatsByProduct) {
      if (!Object.prototype.hasOwnProperty.call(chatsByProduct, pid)) continue;
      var list = chatsByProduct[pid];
      if (!list || !list.length) continue;
      var p = findProduct(Number(pid));
      if (!p) continue;
      var last = list[list.length - 1];
      rows.push({
        productId: Number(pid),
        title: p.title,
        image: p.image,
        icon: p.icon,
        lastText: last.text,
        lastFrom: last.from,
        lastTime: last.time
      });
    }
    rows.sort(function(a, b) { return (b.lastTime || 0) - (a.lastTime || 0); });
  }

  if (!rows.length) {
    chatsList.innerHTML =
      '<div class="chats-empty">' +
        '<div class="chats-empty-icon">💬</div>' +
        '<p>Чатов пока нет</p>' +
        '<p class="hint">Откройте товар и нажмите 💬 — переписка появится здесь</p>' +
      '</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var imgHtml = row.image
      ? '<img src="' + row.image + '" alt="">'
      : (row.icon || '🏪');
    var prefix = row.lastFrom === 'seller' ? 'Продавец' : 'Покупатель';
    var prefixCls = row.lastFrom === 'seller' ? 'prefix-seller' : 'prefix';

    html +=
      '<div class="chat-item" data-chat-product="' + row.productId + '">' +
        '<div class="chat-item-img">' + imgHtml + '</div>' +
        '<div class="chat-item-info">' +
          '<div class="chat-item-title">' + escapeHtml(row.title || 'Товар') + '</div>' +
          '<div class="chat-item-last">' +
            '<span class="' + prefixCls + '">' + prefix + ':</span> ' +
            escapeHtml(row.lastText || '') +
          '</div>' +
        '</div>' +
        '<div class="chat-item-meta">' +
          '<div class="chat-item-time">' + formatChatTime(row.lastTime) + '</div>' +
        '</div>' +
      '</div>';
  }
  chatsList.innerHTML = html;
}

chatsList.addEventListener('click', function(e) {
  var item = e.target.closest('[data-chat-product]');
  if (!item) return;
  var pid = Number(item.getAttribute('data-chat-product'));
  closeChatsList();
  setTimeout(function() { openChat(pid); }, 220);
});

/* ============ ВРЕМЯ В ЧАТЕ ============ */
function formatChatTime(ts) {
  if (!ts) return '';
  var d = new Date(Number(ts));
  if (isNaN(d.getTime())) return '';
  var now = new Date();
  var hh = ('0' + d.getHours()).slice(-2);
  var mm = ('0' + d.getMinutes()).slice(-2);
  if (d.toDateString() === now.toDateString()) return hh + ':' + mm;
  var dd = ('0' + d.getDate()).slice(-2);
  var mo = ('0' + (d.getMonth() + 1)).slice(-2);
  return dd + '.' + mo + ' ' + hh + ':' + mm;
}

/* ============ ПОИСК / ФИЛЬТРЫ / СОРТИРОВКА ============ */
document.getElementById('searchForm').addEventListener('submit', function(e) {
  e.preventDefault();
  state.search = searchInput.value;
  renderProducts();
  clearSearch.classList.toggle('visible', !!searchInput.value);
});

searchInput.addEventListener('input', function() {
  clearSearch.classList.toggle('visible', !!searchInput.value);
});

clearSearch.addEventListener('click', function() {
  searchInput.value = '';
  state.search = '';
  clearSearch.classList.remove('visible');
  renderProducts();
});

categoriesEl.addEventListener('click', function(e) {
  var cat = e.target.closest('.category');
  if (!cat) return;
  state.category = cat.getAttribute('data-category');
  renderCategoryFilters();
  renderProducts();
});

sortSelect.addEventListener('change', function() {
  state.sort = sortSelect.value;
  renderProducts();
});

/* ============ TOAST ============ */
function showToast(msg, isError) {
  toast.textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  if (toast._hideTimer) clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(function() {
    toast.classList.remove('show');
  }, 3200);
}

toast.addEventListener('click', function() {
  toast.classList.remove('show');
});

/* ============ ЗАПУСК ============ */
detectModeAndInit();
</script>
